<title>Misi Kucing Koder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@500&display=swap">
<style>
  /* Layout: satu kolom sempit seperti panel Scratch. Level disusun sebagai tumpukan blok puzzle berwarna kategori Scratch. */
  :root {
    --bg: #F2F5FC;
    --surface: #FFFFFF;
    --surface2: #E9EEF9;
    --ink: #1B2238;
    --muted: #566080;
    --line: #D2DAEE;
    --accent: #2F6FD6;
    --accent-ink: #FFFFFF;
    --ok: #17804A;
    --okbg: #DCF4E7;
    --bad: #C23B33;
    --badbg: #FCE4E1;
    --c-looks: #8A5CF5;
    --f-looks: #FFFFFF;
    --c-control: #FFAB19;
    --f-control: #2B1800;
    --c-ops: #59C059;
    --f-ops: #0F2A0F;
    --c-my: #D63A62;
    --f-my: #FFFFFF;
    --c-event: #FFBF00;
    --f-event: #2B2100;
    --c-motion: #2F6FD6;
    --f-motion: #FFFFFF;
    --c-var: #FF8C1A;
    --f-var: #2B1500;
    --stage: #E4EEFF;
    --stage-line: #C3D4F4;
    --cat: #6A7BA6;
    --cat2: #EEF1FA;
    --cat-in: #F3A6BC;
    --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Fira Code', ui-monospace, Consolas, monospace;
  }

  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131C;
      --surface: #1A1F2D;
      --surface2: #242B3F;
      --ink: #EAEEFA;
      --muted: #9BA6C6;
      --line: #303957;
      --accent: #6C9CFF;
      --accent-ink: #0B1020;
      --ok: #4CD08A;
      --okbg: #133625;
      --bad: #FF7A70;
      --badbg: #3F2120;
      --stage: #1C2540;
      --stage-line: #2E3A62;
      --cat: #8EA0CF;
      --cat2: #2A3350;
      --cat-in: #C9748C;
      color-scheme: dark
    }
  }

  :root[data-theme="dark"] {
    --bg: #10131C;
    --surface: #1A1F2D;
    --surface2: #242B3F;
    --ink: #EAEEFA;
    --muted: #9BA6C6;
    --line: #303957;
    --accent: #6C9CFF;
    --accent-ink: #0B1020;
    --ok: #4CD08A;
    --okbg: #133625;
    --bad: #FF7A70;
    --badbg: #3F2120;
    --stage: #1C2540;
    --stage-line: #2E3A62;
    --cat: #8EA0CF;
    --cat2: #2A3350;
    --cat-in: #C9748C;
    color-scheme: dark
  }

  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--body);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px))
  }

  .shell {
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px
  }

  h1,
  h2,
  h3,
  p {
    margin: 0
  }

  button {
    font: inherit;
    color: inherit
  }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: 0;
    padding: 4px;
    cursor: pointer;
    font: 700 19px var(--display);
    color: var(--ink);
    border-radius: 10px
  }

  .brand .cat {
    width: 36px;
    height: 36px
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 8px
  }

  .pill {
    font: 700 14px var(--body);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 99px;
    padding: 6px 14px;
    font-variant-numeric: tabular-nums
  }

  .btn {
    font: 700 16px var(--body);
    min-height: 46px;
    padding: 0 20px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: transform .08s, background .15s
  }

  .btn:hover {
    background: var(--surface2)
  }

  .btn:active {
    transform: translateY(1px)
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink)
  }

  .btn.primary:hover {
    filter: brightness(1.08);
    background: var(--accent)
  }

  .btn.small {
    min-height: 36px;
    padding: 0 14px;
    font-size: 14px
  }

  .btn[disabled] {
    opacity: .45;
    cursor: not-allowed
  }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 20px
  }

  /* Beranda */
  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: center
  }

  .hero h1 {
    font: 700 clamp(32px, 7vw, 50px)/1.05 var(--display);
    text-wrap: balance
  }

  .hero p {
    margin-top: 12px;
    color: var(--muted);
    max-width: 46ch
  }

  .hero .row {
    margin-top: 18px
  }

  .hero .bigcat {
    width: clamp(110px, 22vw, 180px);
    height: auto
  }

  .mapnote {
    font: 700 13px var(--body);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted)
  }

  .stack {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px
  }

  .lv {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
    text-align: left;
    background: var(--bg-k);
    color: var(--fg-k);
    border: 0;
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: transform .12s
  }

  .lv::after {
    content: "";
    position: absolute;
    left: 30px;
    bottom: -8px;
    width: 32px;
    height: 9px;
    background: var(--bg-k);
    border-radius: 0 0 8px 8px
  }

  .lv:hover {
    transform: translateX(4px)
  }

  .lv .no {
    font: 700 20px var(--display);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .18);
    display: grid;
    place-items: center
  }

  .lv .nm {
    font: 600 20px var(--display);
    line-height: 1.15
  }

  .lv .sb {
    font-size: 14px;
    opacity: .9
  }

  .stars {
    display: inline-flex;
    gap: 2px
  }

  .stars svg {
    width: 20px;
    height: 20px
  }

  .k-looks {
    --bg-k: var(--c-looks);
    --fg-k: var(--f-looks)
  }

  .k-control {
    --bg-k: var(--c-control);
    --fg-k: var(--f-control)
  }

  .k-ops {
    --bg-k: var(--c-ops);
    --fg-k: var(--f-ops)
  }

  .k-my {
    --bg-k: var(--c-my);
    --fg-k: var(--f-my)
  }

  .k-event {
    --bg-k: var(--c-event);
    --fg-k: var(--f-event)
  }

  .k-motion {
    --bg-k: var(--c-motion);
    --fg-k: var(--f-motion)
  }

  .k-var {
    --bg-k: var(--c-var);
    --fg-k: var(--f-var)
  }

  /* Intro level */
  .intro h2 {
    font: 700 30px/1.1 var(--display);
    margin: 6px 0 4px
  }

  .intro .tag {
    display: inline-block;
    font: 700 13px var(--body);
    letter-spacing: .06em;
    text-transform: uppercase;
    background: var(--bg-k);
    color: var(--fg-k);
    padding: 4px 12px;
    border-radius: 99px
  }

  .intro ul {
    margin: 14px 0 18px;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px
  }

  .intro .preview {
    margin: 4px 0 18px
  }

  /* Bar bermain */
  .playbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap
  }

  .pname {
    font: 600 18px var(--display);
    display: flex;
    align-items: center;
    gap: 8px
  }

  .pname i {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: var(--bg-k)
  }

  .prog {
    flex: 1;
    min-width: 120px;
    height: 10px;
    border-radius: 99px;
    background: var(--surface2);
    overflow: hidden
  }

  .prog i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 99px;
    transition: width .3s
  }

  .pc {
    font: 700 14px var(--body);
    color: var(--muted);
    font-variant-numeric: tabular-nums
  }

  .stage {
    margin-top: 14px;
    min-height: 320px
  }

  /* Pertanyaan */
  .qtag {
    font: 700 13px var(--body);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px
  }

  .qp {
    font: 600 22px/1.25 var(--display);
    text-wrap: balance
  }

  .code {
    background: var(--surface2);
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
    overflow-x: auto
  }

  .code pre {
    margin: 0;
    font: 500 14px/1.6 var(--mono)
  }

  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 14px
  }

  .facts .fl {
    font: 700 13px var(--body);
    color: var(--muted);
    margin-right: 4px
  }

  .fact {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    background: var(--surface2);
    border-radius: 99px;
    padding: 5px 6px 5px 12px;
    font-size: 14px
  }

  .fact code {
    font: 500 13px var(--mono)
  }

  .tf {
    font: 700 12px var(--body);
    padding: 2px 10px;
    border-radius: 99px;
    color: #fff
  }

  .tf.t {
    background: #17804A
  }

  .tf.f {
    background: #C23B33
  }

  .opts {
    display: grid;
    gap: 10px;
    margin-top: 16px
  }

  .opt {
    display: block;
    width: 100%;
    text-align: left;
    min-height: 48px;
    padding: 11px 16px;
    border-radius: 12px;
    background: var(--surface);
    border: 2px solid var(--line);
    cursor: pointer;
    font: 600 16px var(--body)
  }

  .opt:hover:not([disabled]) {
    border-color: var(--accent)
  }

  .opt.ok {
    background: var(--okbg);
    border-color: var(--ok);
    color: var(--ink)
  }

  .opt.bad {
    background: var(--badbg);
    border-color: var(--bad);
    animation: shake .3s
  }

  .opt[disabled] {
    cursor: default
  }

  .opt.dim {
    opacity: .55
  }

  .fb {
    min-height: 24px;
    margin-top: 14px;
    font-weight: 600
  }

  .fb.ok {
    color: var(--ok)
  }

  .fb.bad {
    color: var(--bad)
  }

  .fb .btn {
    margin-top: 12px;
    display: block
  }

  .fb .exp {
    font-weight: 400;
    color: var(--ink);
    margin-top: 2px
  }

  @keyframes shake {
    25% {
      transform: translateX(-5px)
    }

    75% {
      transform: translateX(5px)
    }
  }

  @keyframes pop {
    0% {
      transform: scale(.4);
      opacity: 0
    }

    70% {
      transform: scale(1.15)
    }

    100% {
      transform: scale(1);
      opacity: 1
    }
  }

  /* Blok kode */
  .script {
    display: flex;
    flex-direction: column;
    gap: 0
  }

  .blk {
    width: fit-content;
    max-width: 100%;
    margin-top: 2px
  }

  .blk .bt {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: var(--bg-k);
    color: var(--fg-k);
    padding: 7px 12px;
    border-radius: 6px;
    font: 700 14px/1.4 var(--body)
  }

  .blk.hat .bt {
    border-radius: 18px 18px 6px 6px;
    padding-top: 11px
  }

  .blk.c>.bt {
    border-radius: 6px 6px 6px 0
  }

  .blk .bin {
    border-left: 16px solid var(--bg-k);
    padding-left: 0
  }

  .blk .bfoot {
    height: 12px;
    width: 64px;
    background: var(--bg-k);
    border-radius: 0 0 6px 6px
  }

  .blk small {
    font-weight: 600;
    opacity: .85
  }

  .slot {
    background: #fff;
    color: #1B2238;
    border-radius: 99px;
    padding: 0 10px;
    font-weight: 700;
    min-width: 26px;
    text-align: center;
    display: inline-block
  }

  .bool {
    background: #fff;
    color: #1B2238;
    border-radius: 99px;
    padding: 0 10px;
    font-weight: 700;
    display: inline-block
  }

  .bool b {
    color: #2F6FD6
  }

  .blk.hot>.bt {
    box-shadow: 0 0 0 3px var(--ink), 0 0 18px 2px var(--bg-k)
  }

  .hotcard {
    box-shadow: 0 0 0 3px var(--accent) !important
  }

  /* Stepper */
  .stp {
    display: inline-flex;
    align-items: center;
    background: #fff;
    color: #1B2238;
    border-radius: 99px;
    overflow: hidden
  }

  .stp button {
    width: 30px;
    height: 28px;
    border: 0;
    background: rgba(0, 0, 0, .08);
    color: #1B2238;
    font: 700 18px/1 var(--body);
    cursor: pointer
  }

  .stp button:hover:not([disabled]) {
    background: rgba(0, 0, 0, .18)
  }

  .stp button[disabled] {
    opacity: .35;
    cursor: default
  }

  .stp output {
    min-width: 34px;
    text-align: center;
    font: 700 15px var(--body)
  }

  /* Sortir kartu */
  .sortcard {
    margin: 16px 0;
    min-height: 128px;
    display: grid;
    place-items: center;
    text-align: center;
    background: var(--surface2);
    border: 2px dashed var(--line);
    border-radius: 16px;
    padding: 20px;
    font: 600 21px/1.35 var(--display);
    white-space: pre-wrap
  }

  .sortcard.mono {
    font: 500 16px/1.6 var(--mono);
    text-align: left;
    place-items: center start
  }

  .sortcard.in {
    animation: pop .25s
  }

  .sortcard.no {
    animation: shake .3s;
    border-color: var(--bad)
  }

  .sortcard.yes {
    border-color: var(--ok);
    background: var(--okbg)
  }

  .bins {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px
  }

  .binb {
    min-height: 64px;
    border-radius: 14px;
    border: 2px solid transparent;
    font: 600 19px var(--display);
    cursor: pointer;
    padding: 10px
  }

  .binb small {
    display: block;
    font: 600 13px var(--body);
    opacity: .85
  }

  .binb.blokb {
    background: var(--c-looks);
    color: var(--f-looks)
  }

  .binb.teksb {
    background: #1E2433;
    color: #EAEEFA;
    border-color: #3A4466
  }

  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 4px
  }

  .dots i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1.5px solid var(--line)
  }

  .dots i.on {
    background: var(--ok);
    border-color: var(--ok)
  }

  .hintkeys {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px
  }

  /* Lantai */
  .floorwrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    gap: 18px;
    margin-top: 14px;
    align-items: start
  }

  .floor {
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    padding: 3px;
    aspect-ratio: 6/4;
    background: var(--stage-line);
    border-radius: 12px
  }

  .tile {
    background: var(--stage);
    border-radius: 4px;
    position: relative;
    display: grid;
    place-items: center;
    font: 700 13px var(--body)
  }

  .tile.dirty {
    background: #C9B48A;
    background-image: radial-gradient(#8E7650 1.6px, transparent 2px), radial-gradient(#8E7650 1.2px, transparent 1.6px);
    background-size: 14px 14px, 9px 9px;
    background-position: 3px 4px, 8px 2px
  }

  .tile.done {
    background: #BFEBD2;
    background-image: none
  }

  .tile.waste {
    background: var(--badbg);
    background-image: none
  }

  .tile.done::after {
    content: "\2713";
    color: #17804A
  }

  .tile.waste::after {
    content: "\00D7";
    color: var(--bad);
    font-size: 18px
  }

  .walker {
    position: absolute;
    pointer-events: none;
    transition: left .14s, top .14s;
    opacity: 0;
    display: grid;
    place-items: center
  }

  .walker.on {
    opacity: 1
  }

  .walker .cat {
    width: 80%;
    height: 80%
  }

  .floornote {
    font-size: 14px;
    color: var(--muted);
    margin-top: 8px
  }

  .floornote b {
    color: var(--ink)
  }

  .lbl {
    font: 700 12px var(--body);
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px
  }

  /* Mesin logika */
  .lm {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
    margin-top: 14px;
    align-items: start
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap
  }

  .tab {
    min-height: 42px;
    padding: 0 20px;
    border-radius: 99px;
    border: 2px solid var(--line);
    background: var(--surface);
    font: 700 15px var(--body);
    cursor: pointer
  }

  .tab[aria-pressed="true"] {
    background: var(--c-ops);
    border-color: var(--c-ops);
    color: var(--f-ops)
  }

  .tab .ck {
    display: inline-block;
    width: 0;
    overflow: hidden;
    transition: width .2s;
    vertical-align: bottom
  }

  .tab.seen .ck {
    width: 18px
  }

  .sw {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px
  }

  .sw label {
    font: 700 15px var(--body);
    min-width: 84px
  }

  .tg {
    position: relative;
    width: 68px;
    height: 36px;
    border-radius: 99px;
    border: 0;
    background: #C23B33;
    cursor: pointer;
    transition: background .15s;
    color: #fff;
    font: 700 12px var(--body)
  }

  .tg[aria-checked="true"] {
    background: #17804A
  }

  .tg i {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s
  }

  .tg[aria-checked="true"] i {
    left: 36px
  }

  .tg span {
    position: absolute;
    top: 0;
    bottom: 0;
    display: grid;
    place-items: center;
    width: 34px
  }

  .tg .tv {
    right: 2px
  }

  .tg .fv {
    left: 2px
  }

  .lamp {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--surface2);
    font: 700 16px var(--body)
  }

  .lamp i {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #C23B33;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
    transition: background .15s, box-shadow .15s
  }

  .lamp.on i {
    background: #2ED477;
    box-shadow: 0 0 16px 4px #2ED47788
  }

  table.tt {
    border-collapse: collapse;
    width: 100%;
    font-size: 15px
  }

  table.tt th,
  table.tt td {
    padding: 7px 10px;

    <div class="row"><button type="button" class="btn primary" id="go">${L.final ? 'Main sekarang' : 'Mulai level'}</button><button type="button" class="btn" id="bk">Kembali ke peta</button></div></section>`;
      $('#go').onclick = () => play(L); $('#bk').onclick = home;
    }
    async function play(L) {
      teardown();
      const items = L.build(), ctx = {mistakes: 0, points: 0, area: null, lives: null};
      app.innerHTML = `<div class="playbar k-${L.k}"><button type="button" class="btn small" id="bk">Peta</button><div class="pname"><i></i>${L.name}</div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}"><i id="pf"></i></div><span class="pc" id="pc"></span></div><section class="card stage" id="stage"></section>`;
      $('#bk').onclick = home;
      const myEpoch = epoch;
      for (let i = 0; i < items.length; i++) {
        if (myEpoch !== epoch) return;
        $('#pf').style.width = (i / items.length * 100) + '%'; $('#pc').textContent = `${i + 1} / ${items.length}`;
        const st = $('#stage'); st.innerHTML = ''; ctx.area = st;
        window.scrollTo({top: 0, behavior: 'instant'});
        await items[i].run(ctx);
        if (myEpoch !== epoch) return;
        cleanups.forEach(f => {try {f()} catch (e) { } }); cleanups = [];
      }
      finish(L, ctx);
    }
    function finish(L, ctx) {
      teardown();
      let stars = ctx.mistakes <= 1 ? 3 : ctx.mistakes <= 4 ? 2 : 1;
      if (ctx.lives != null) {const gs = ctx.lives >= 3 && !ctx.fails ? 3 : ctx.lives >= 2 ? 2 : 1; stars = L.final ? gs : Math.min(stars, gs)}
      S.stars[L.id] = Math.max(S.stars[L.id] || 0, stars); S.pts[L.id] = Math.max(S.pts[L.id] || 0, ctx.points); save(); updHud(); submitScore();
      const msg = stars === 3 ? 'Hampir tanpa salah. Konsepnya sudah kuat.' : stars === 2 ? 'Bagus. Ulangi untuk mengejar bintang penuh.' : 'Selesai. Baca ringkasan level lalu coba lagi untuk bintang lebih banyak.';
      sfx.win();
      app.innerHTML = `<section class="card result">${starsHTML(stars)}<h2>${L.final ? 'Misi selesai!' : 'Level ' + L.id + ' selesai'}</h2>
    <p>${msg}</p><div class="sum"><span class="pill">+${ctx.points} poin</span><span class="pill">${ctx.mistakes + (ctx.fails || 0)} kesalahan</span></div>
    <div class="row" style="justify-content:center;margin-top:6px" id="acts"></div></section>`;
      const acts = $('#acts');
      const add = (t, f, p) => {const b = h(`<button type="button" class="btn${p ? ' primary' : ''}">${t}</button>`); b.onclick = f; acts.appendChild(b)};
      if (L.final) add('Lihat hasil akhir', ending, true); else add('Lanjut ke ' + (byId(L.id + 1).final ? 'game penutup' : 'level ' + (L.id + 1)), () => intro(byId(L.id + 1)), true);
      add('Leaderboard', boardScreen); add('Ulangi level', () => play(L)); add('Peta', home);
    }
    function ending() {
      teardown(); const ts = totalStars(); submitScore();
      const rank = ts >= 16 ? 'Master Scratch' : ts >= 11 ? 'Kucing Programmer' : 'Kucing Pemula';
      app.innerHTML = `<section class="card result"><div class="cat-wrap">${catSVG('bigcat')}</div><div class="rank">${rank}</div><h2>Hasil akhir</h2>
    <p>Kamu sudah melewati koding blok dan teks, nested loop, logika gabungan, My Block berparameter, event handling, dan game penutup.</p>
    <div class="sum"><span class="pill">${ts} dari 18 bintang</span><span class="pill">${totalPts()} poin</span></div>
    <div class="row" style="justify-content:center"><button type="button" class="btn primary" id="lb">Leaderboard</button><button type="button" class="btn" id="k">Kartu hasil</button><button type="button" class="btn" id="m">Kembali ke peta</button></div></section>`;
      $('.bigcat').style.width = '110px'; $('#m').onclick = home; $('#k').onclick = cardScreen; $('#lb').onclick = boardScreen;
    }

    $('#homeBtn').innerHTML = catSVG() + '<span>Misi Kucing Koder</span>';
    $('#homeBtn').onclick = home;
    $('#snd').onclick = e => {soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = 'Suara: ' + (soundOn ? 'nyala' : 'mati'); if (soundOn) sfx.tick()};
    home();
  })();
</script>
